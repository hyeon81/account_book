services:
  api:
    build:
      context: .
      dockerfile: server/Dockerfile
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}
      OPENAI_CATEGORY_MODEL: ${OPENAI_CATEGORY_MODEL:-gpt-4.1-mini}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 3
  ui:
    depends_on:
      api:
        condition: service_healthy
    environment:
      API_PROXY_TARGET: http://api:8000
    build:
      context: ./ui
    ports:
      - "127.0.0.1:8080:8080"
  scripts:
    build:
      context: .
      dockerfile: Dockerfile.dev
    working_dir: /workspace
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
    volumes:
      - type: bind
        source: ./README.md
        target: /workspace/README.md
        read_only: true
      - type: bind
        source: ./VERSION
        target: /workspace/VERSION
        read_only: true
      - type: bind
        source: ./CHANGELOG.md
        target: /workspace/CHANGELOG.md
        read_only: true
      - type: bind
        source: ./ui/README.md
        target: /workspace/ui/README.md
        read_only: true
      - type: bind
        source: ./docs
        target: /workspace/docs
        read_only: true
      - type: bind
        source: ./scripts
        target: /workspace/scripts
        read_only: true
      - type: bind
        source: ./tests
        target: /workspace/tests
        read_only: true
      - type: bind
        source: ./server
        target: /workspace/server
        read_only: true
      - type: bind
        source: ./pytest.ini
        target: /workspace/pytest.ini
        read_only: true
    command: ["python", "scripts/validate_docs.py"]
